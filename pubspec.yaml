name: goguma
description: An IRC client for mobile devices.

publish_to: 'none'

# Build number is the Git commit count, obtained via:
#
#     git rev-list --first-parent --count HEAD
version: 0.8.0+1206

environment:
  sdk: ^3.0.0
  flutter: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.1
  shared_preferences: '^2.0.5'
  url_launcher: '^6.0.2'
  linkify: ^5.0.0
  sqflite: ^2.0.2
  path: ^1.8.1
  sqflite_common_ffi: ^2.1.0+2
  # TODO: switch back to the registry once this issue has been resolved:
  # https://github.com/fluttercommunity/flutter_workmanager/issues/588
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: 4ce065135dc1b91fee918f81596b42a56850391d
  flutter_local_notifications: ^19.0.0
  flutter_background: ^1.3.0
  connectivity_plus: ^6.0.2
  shared_preferences_android: ^2.0.12
  # TODO: replace "webcrypto" with the "cryptography" package once they have a
  # pure Dart Ecdh.p256 implementation
  webcrypto: ^0.5.7
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  app_links: ^6.1.1
  unifiedpush: ^5.0.0
  sentry: ^8.2.0
  share_plus: ^11.0.0
  flutter_flipped_autocomplete: ^1.0.0
  scrollable_positioned_list: ^0.3.5
  html: ^0.15.2
  geolocator: ^14.0.0
  image_picker: ^1.0.4
  mime: ^2.0.0
  file_selector: ^1.0.1
  flutter_apns_only: ^1.6.0
  share_handler: ^0.0.21
  dynamic_color: ^1.7.0
  hex: ^0.2.0
  async: ^2.11.0

dev_dependencies:
  flutter_lints: ^5.0.0

dependency_overrides:
  # TODO: switch back to the registry once these two PRs have been merged:
  # https://github.com/ShoutSocial/share_handler/pull/118
  # https://github.com/ShoutSocial/share_handler/pull/119
  share_handler_android:
    git:
      url: https://github.com/emersion/share_handler.git
      path: share_handler_android
      ref: goguma

flutter:
  uses-material-design: true
