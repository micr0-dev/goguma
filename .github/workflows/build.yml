name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "${SDKMANAGER}" ]; then
            "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --licenses < /dev/null > /dev/null || true
            "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found at ${SDKMANAGER}; relying on Gradle to resolve SDK packages."
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goguma-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
